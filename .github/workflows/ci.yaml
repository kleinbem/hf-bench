name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: kleinbem/actions/nix-setup@b3ffb6b2eeb888969e5f16640c84a55956581542 # v1.9.0
      - name: Flake check
        run: nix flake check -L
      - name: Build Space and CLI
        run: nix build --no-link .#default .#hf-bench
